[pytest]
filterwarnings =
    ignore:'typing.ByteString' and 'collections.abc.ByteString' are deprecated:DeprecationWarning:pymupdf
# Releasing the COM proxy of a Word that has quit raises a handled RPC error
# (0x800706be); pytest's faulthandler would print it as a "fatal exception".
addopts = -p no:faulthandler
