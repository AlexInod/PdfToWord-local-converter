<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Converter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="body">
  <div class="seg" role="tablist">
    <span class="thumb" aria-hidden="true"></span>
    <button id="mode-pdf" class="on" type="button" role="tab" aria-selected="true">PDF to Word</button>
    <button id="mode-word" type="button" role="tab" aria-selected="false">Word to PDF</button>
  </div>

  <div id="banner" class="banner" hidden>Word or LibreOffice must be installed for Word to PDF</div>

  <div id="drop" class="drop">
    <svg width="34" height="40" viewBox="0 0 34 40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 2h18l8 8v26a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M22 2v8h8"/><path d="M17 17v12M12 24l5 5 5-5" stroke-linecap="round"/></svg>
    <h4 id="drop-title">Drop PDF files here</h4>
    <p><span id="drop-hint"></span><a id="choose" href="#">choose files</a></p>
  </div>

  <div id="list" class="list"></div>

  <div class="foot">
    <span>Saved next to the original files</span>
    <button id="open-folder" class="btn" type="button" disabled>Open folder</button>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
